[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harboria-portid"
version = "0.2.0"
description = "PortID Python SDK — Zero-knowledge encrypted data sync for AI and app developers."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Harboria Labs", email = "contact@harboria.com"}]

dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["portid_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
